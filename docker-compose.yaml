# Apostol CSMS — brand deployment compose (Phase 10 zero-build).
#
# Pure-image deployment: every platform component is pulled from GHCR
# and pinned by digest in envs/<env>/platform.lock.json → PLATFORM_VERSION
# in workdir/.env.  The brand side never builds platform code; only
# infra (nginx/pgbouncer/pgweb) and the brand-specific landing site are
# built locally.
#
# Usage:
#   docker compose --env-file workdir/.env pull
#   docker compose --env-file workdir/.env up -d
#
# Or install.sh / update.sh handle the orchestration end-to-end.
#
# Conventions:
#   - Platform: backend, ocpp, db-init/db-migrate, frontend, driver, pay,
#     auth → image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-*:${PLATFORM_VERSION}.
#   - csms-db image ships encrypted SQL (Phase 4c) — runtime decryption
#     via license envelope's db_key_wrapped, no source code on the brand
#     side.
#   - SPA images are brand-agnostic — runtime brand identity comes from
#     the license attestation chain (Phase 6/7/8/9).
#   - Landing is brand-specific (per <brand>/landing repo) — `build:`.
#   - Infra (nginx, pgbouncer, pgweb): bundled .docker/ Dockerfiles.
#     Brand-specific chunks live under .docker/ too — operator may
#     customize without touching this compose.

# Compose project name — prefixes networks (<name>_lan-network, …) and
# named volumes (<name>_postgresql, …). MUST be set explicitly via
# workdir/.env (PROJECT_NAME=...); install.sh fills it from the brand
# code in .secrets/license.json if the brand env didn't set it.
#
# Why fail-fast (`:?...`) instead of silent fallback (`:-csms`):
# a default would silently mask a missing env on a brand-new install,
# and later — when the operator finally sets PROJECT_NAME=<brand> —
# compose would create FRESH volumes under <brand>_* and orphan the
# original csms_* ones. Months of accumulated postgres data would still
# exist on disk but be invisible to the running stack. Refuse to start
# at all when the value is missing.
name: '${PROJECT_NAME:?PROJECT_NAME must be set in workdir/.env (use the brand code, e.g. plugme / ocpp-css)}'

# ─── SPA healthcheck (shared via YAML anchor) ─────────────────
#
# All five SPA apps (landing/frontend/driver/pay/auth) listen :3000
# inside the container. Without a healthcheck Docker reports the
# container "started" the moment the first process forks — before
# Next.js / Nuxt finish bootstrapping — and nginx (which waits on
# service_healthy) may route to a container that isn't listening
# yet, or worse to an IP just reassigned from a sibling. That's
# the root cause of bare ${DOMAIN} serving auth SPA after
# update.sh's rolling-recreate. Paired with update.sh's two-phase
# rolling_restart this keeps deploys race-free.
#
# Probe: TCP-listen check via busybox `netstat`. Not an HTTP probe
# on purpose:
#   - Next.js standalone's `node server.js` binds to $HOSTNAME (the
#     container name → the docker-bridge IP), NOT 127.0.0.1 or
#     0.0.0.0, so `wget http://127.0.0.1:3000/` fails.
#   - Next.js `/` does a locale redirect whose Location is not
#     resolvable by busybox wget's --spider.
# TCP-listen catches the real race we care about (process forked
# but not yet accepting connections). Semantic HTTP checks live in
# check.sh, probing from outside via public URLs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-spa-healthcheck: &spa-healthcheck
  test: ["CMD-SHELL", "netstat -tln 2>/dev/null | grep -q ':3000 ' || exit 1"]
  interval: 5s
  timeout: 3s
  retries: 24
  start_period: 20s

# ─── Infrastructure ───────────────────────────────────────────

services:

  nginx:
    build:
      context: ./.docker/nginx-certbot
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io/library}
    container_name: nginx
    hostname: ${DOMAIN:-localhost}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks:
      wan-network:
      lan-network:
        aliases:
          - dev.${DOMAIN:-localhost}
          - cloud.${DOMAIN:-localhost}
          - cpo.${DOMAIN:-localhost}
          - cs.${DOMAIN:-localhost}
          - driver.${DOMAIN:-localhost}
          - admin.${DOMAIN:-localhost}
          - landing.${DOMAIN:-localhost}
          - ocpp.${DOMAIN:-localhost}
          - auth.${DOMAIN:-localhost}
          - pay.${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    # Every proxied WebSocket costs one ephemeral port on the upstream side,
    # and the kernel default range holds 28 232 of them — a ceiling that shows
    # up only once a deployment passes roughly that many charging stations, as
    # a refusal to connect rather than as an error anyone would look for.
    # Widening the range here keeps the limit a deliberate number instead of a
    # default nobody chose. nofile follows worker_rlimit_nofile in nginx.conf.
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Wait for each SPA to pass its HTTP healthcheck before nginx is
    # allowed to route traffic. Prevents bare-domain ↔ auth confusion
    # after rolling restart (see x-spa-healthcheck comment above).
    # backend/ocpp don't ship healthchecks yet → service_started.
    depends_on:
      backend:  { condition: service_started }
      ocpp:     { condition: service_started }
      landing:  { condition: service_healthy }
      frontend: { condition: service_healthy }
      driver:   { condition: service_healthy }
      pay:      { condition: service_healthy }
      auth:     { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt

  wireguard:
    build: ./.docker/wireguard
    container_name: wireguard
    profiles: ["vpn"]
    environment:
      - PUID=1000
      - PGID=1000
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.conf.all.proxy_arp=1
    ports:
      - "51828:51828/udp"
    networks:
      - wan-network
      - lan-network
      - db-network
    volumes:
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped

  # ─── Database ─────────────────────────────────────────────

  postgres:
    image: ${BASE_REGISTRY:-docker.io/library}/postgres:18

    logging: *default-logging
    container_name: postgres
    cap_add:
      - NET_ADMIN
    networks:
      - db-network
    ports:
      - "127.0.0.1:5431:5432"
    restart: unless-stopped
    # Tuning passed as `-c` flags so we keep the vanilla postgres:18
    # image (zero-build, Phase 10).  Mirrors the reference profile in
    # `.docker/postgres/postgresql.conf` (kept in the repo as the
    # canonical pgtune-style baseline — see https://pgtune.leopard.in.ua).
    #
    # Why max_connections=200: with WORKER_PROCESSES=8 the backend pool
    # holds ~64 apibot + ~31 daemon slots permanently, leaving no room
    # for kernel (db-migrate) or one-off admin queries.  200 leaves
    # headroom; at ~10 MB per idle slot this is well within reach on a
    # 4+ GB host.  Revisit if WORKER_PROCESSES is tuned above 16.
    #
    # `search_path` is set per-database via ALTER DATABASE in the
    # csms-db image's compose-env.sh — not here — so the value lives
    # next to the project.* GUCs and survives DB-level migrations.
    command:
      - "postgres"
      # search_path: Apostol CRM expects "kernel, public" first.
      # `$$user` is escaped from docker-compose's $-interpolation so
      # postgres receives the literal "$user" identifier (which it then
      # resolves to the connecting role's name at session start).
      - "-c"
      - 'search_path="$$user", kernel, public'
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-200}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=${PG_WAL_BUFFERS:-16MB}"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-1310kB}"
      - "-c"
      - "huge_pages=off"
      - "-c"
      - "min_wal_size=${PG_MIN_WAL_SIZE:-1GB}"
      - "-c"
      - "max_wal_size=${PG_MAX_WAL_SIZE:-4GB}"
      # Parallelism follows the host core count. The postgres default of 8
      # workers is actively harmful on a 2-core VPS and leaves a 20-thread
      # machine idle — neither is a value that belongs in a shared file.
      - "-c"
      - "max_worker_processes=${PG_MAX_WORKER_PROCESSES:-2}"
      - "-c"
      - "max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-2}"
      - "-c"
      - "max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-1}"
      # pg_stat_statements is how the OCPP hot path was profiled on 2026-08-07;
      # without it the 268 ms per message that a VOLATILE function in a WHERE
      # clause was costing is invisible — pg_stat_activity only ever showed the
      # outer ocpp.parse() call. Overhead is a couple of percent. Set
      # `pg_stat_statements.track = all` (ALTER SYSTEM) when profiling inside
      # PL/pgSQL; the default only counts top-level statements.
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    env_file:
      - ./workdir/.env
    environment:
      POSTGRES_DB: ${PGDATABASE:-csms}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BUILD_ENV: ${BUILD_ENV:-dev}
    volumes:
      # postgres:18+ requires the volume at /var/lib/postgresql (not /data)
      # so that pg_ctlcluster's major-version subdirectories sit inside
      # the mount. See docker-library/postgres#1259.
      - postgresql:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 10s
      timeout: 5s
      retries: 3

  pgbouncer:
    build:
      context: ./.docker/pgbouncer
      args:
        PGBOUNCER_IMAGE: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:latest}
    container_name: pgbouncer
    networks:
      - db-network
    restart: unless-stopped
    # No userlist.txt bind-mount — pgbouncer's docker-entrypoint.sh
    # regenerates it in-container from pg_authid on every start
    # (SCRAM-SHA-256 hashes for postgres:18 runtime roles).  Bind-
    # mounting a host file made the in-place rewrite fail (Resource busy
    # for `mv`, Permission denied for `cat >` due to UID mismatch).
    # The image's writable layer holds the regenerated file fine.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./workdir/.env
    environment:
      DB_NAME: ${PGDATABASE:-csms}
    healthcheck:
      # Explicit -U to avoid "no such user: postgres" log spam —
      # pg_isready defaults to the `postgres` OS user which isn't in
      # pgbouncer's userlist. kernel is always present.
      test: ['CMD', 'pg_isready', '-h', 'pgbouncer', '-p', '6432', '-U', 'kernel']
      interval: 10s
      timeout: 5s
      retries: 3

  pgweb:
    build:
      context: ./.docker/pgweb
      args:
        PGWEB_IMAGE: ${PGWEB_IMAGE:-sosedoff/pgweb:latest}
    container_name: pgweb
    restart: unless-stopped
    networks:
      - lan-network
      - db-network
    environment:
      PGWEB_DATABASE_URL: "postgres://admin:${DB_PASS_ADMIN}@postgres:5432/${PGDATABASE:-csms}?sslmode=disable"
      PGWEB_URL_PREFIX: pgweb
      PGWEB_AUTH_USER: admin
      PGWEB_AUTH_PASS: ${DB_PASS_ADMIN}
    depends_on:
      postgres:
        condition: service_healthy

  # ─── DB init + migrate (same image, different entrypoints) ──
  #
  # Phase 10 — csms-db ships as a public GHCR image with the encrypted
  # SQL configuration baked in (CI build-arg CSMS_DB_KEY → AES-CTR
  # tarball).  Brand side never sees the SQL sources; init.sh decrypts
  # at runtime via license envelope's db_key_wrapped (Phase 4c).

  db-init:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-db:${PLATFORM_VERSION:-latest}
    container_name: db-init
    entrypoint: ["/opt/csms-db/docker/init.sh"]
    networks:
      - db-network
    env_file:
      - ./workdir/.env
    volumes:
      # csms-secrets persistent volume — entrypoint-secrets.sh writes
      # passwords.psql / oauth2.psql / install.pgpass / db.pgpass here
      # on first install (idempotent across restarts).  In image-mode
      # compose-env.sh composes $SQL_DIR/.env/.env.psql by \ir-ing those
      # files alongside project.* GUCs derived from license.json.
      - csms-secrets:/var/lib/csms/secrets
      # License envelope — Phase 4c db_key_wrapped → CSMS_DB_KEY via
      # extract-db-key.sh; Phase 2d payload.brand → project.* GUCs via
      # compose-env.sh.  pre-install hook copies it from .secrets/.
      - ./conf/license.json:/etc/csms/conf/license.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-migrate:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-db:${PLATFORM_VERSION:-latest}
    container_name: db-migrate
    entrypoint: ["/opt/csms-db/docker/migrate.sh"]
    networks:
      - db-network
    env_file:
      - ./workdir/.env
    environment:
      # migrate.sh reads PGPASSWORD (or KERNEL_PASSWORD) for the `kernel`
      # role. env_file gives us DB_PASS_KERNEL but that name is not in
      # migrate.sh's fallback chain — without this explicit mapping the
      # guard `SELECT 1 FROM pg_database` fails with "no password
      # supplied" and the script misleadingly logs `database
      # '<PGDATABASE>' does not exist — db-init should run first`.
      # Mirrors the pattern backend/ocpp already use for DB_PASS_DAEMON.
      PGPASSWORD: ${DB_PASS_KERNEL}
    volumes:
      # Same csms-secrets + license.json as db-init.
      - csms-secrets:/var/lib/csms/secrets
      - ./conf/license.json:/etc/csms/conf/license.json:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # ─── Platform services (pulled from GHCR) ───────────────────

  backend:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-backend:${PLATFORM_VERSION:-latest}

    logging: *default-logging
    container_name: backend
    networks:
      - lan-network
      - db-network
    restart: unless-stopped
    env_file:
      - ./workdir/.env
    environment:
      # Legacy libpq/app name compatibility (brand SSOT uses new naming).
      PGPASSWORD: ${DB_PASS_DAEMON}
      PGPASSWORDAPI: ${DB_PASS_APIBOT}
      CLIENT_SECRET_SERVICE: ${OAUTH2_SECRET_SERVICE}
      CLIENT_SECRET_WEB: ${OAUTH2_SECRET_WEB}
      CLIENT_SECRET_ANDROID: ${OAUTH2_SECRET_ANDROID}
      CLIENT_SECRET_IOS: ${OAUTH2_SECRET_IOS}
      WORKER_PROCESSES: ${WORKER_PROCESSES:-8}
      PGSSLCERT: /tmp/postgresql.crt
      PGHOST: pgbouncer
      PGPORT: 6432
      PGUSER: daemon
      PGHOSTAPI: postgres
      PGPORTAPI: 5432
      PGUSERAPI: apibot
    volumes:
      - tmp:/tmp/csms
      - files:/etc/csms/files
      # License envelope — read by both process-LicenseServer (Phase 3a)
      # and module-LicenseServer (Phase 3b) at boot + on mtime change.
      - ./conf/license.json:/etc/csms/conf/license.json:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started

  ocpp:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-ocpp:${PLATFORM_VERSION:-latest}

    logging: *default-logging
    container_name: ocpp
    networks:
      - lan-network
      - db-network
    ports:
      - "9220:9220"
    restart: unless-stopped
    env_file:
      - ./workdir/.env
    environment:
      PGPASSWORD: ${DB_PASS_OCPP}
      PGPASSWORDAPI: ${DB_PASS_APIBOT}
      CLIENT_SECRET_SERVICE: ${OAUTH2_SECRET_SERVICE}
      CLIENT_SECRET_WEB: ${OAUTH2_SECRET_WEB}
      CLIENT_SECRET_ANDROID: ${OAUTH2_SECRET_ANDROID}
      CLIENT_SECRET_IOS: ${OAUTH2_SECRET_IOS}
      CLIENT_SECRET_OCPP: ${OAUTH2_SECRET_OCPP}
      PGSSLCERT: /tmp/postgresql.crt
      PGHOST: pgbouncer
      PGPORT: 6432
      PGUSER: ocpp
      PGHOSTAPI: postgres
      PGPORTAPI: 5432
      PGUSERAPI: apibot
      API_HOST: cloud.${DOMAIN:-localhost}
      OCPP_HOST: cs.${DOMAIN:-localhost}
    depends_on:
      - backend

  # ─── Frontend apps (Phase 10 — pulled from GHCR) ─────────────
  #
  # All four SPA images (csms-webapp, csms-driver, csms-pay, csms-auth)
  # are brand-agnostic: brand identity (logo, name, theme, OAuth2
  # client_id / scope) is delivered at runtime via the license-driven
  # attestation chain (Phase 6/7/8/9 — main.ts loads
  # /platform-pubkey.pem + fetches /api/v1/session/init).  No build-args
  # are baked into the image any more.
  #
  # Map keys (Google Maps / Stadia / Yandex) and Stripe publishable key
  # are still build-time inlined and currently default to empty in CI
  # builds — those features will degrade gracefully (no map, no Stripe
  # Payment Element) until Phase 11+ extends /session/init to ship them
  # at runtime.  Brands needing them today must build their own private
  # fork of csms-{webapp,driver,pay} via their own CI.
  #
  # `landing` is brand-specific (per-brand <brand>/landing repo, e.g.
  # ocpp-css/landing) — kept as `build:` here.  Comment-out + uncomment
  # the service to match what your brand has bootstrapped.

  # `landing` is brand-specific (per-brand <brand>/landing repo, e.g.
  # chargemecar/landing or ocpp-css/landing). Each landing repo carries
  # its own .github/workflows/release.yml that builds the Nuxt SPA,
  # pushes :latest + :sha-<short> to ghcr.io/<brand>/landing, then SSHes
  # into the brand server and recreates the landing container.
  #
  # BRAND_GITHUB_ORG defaults to PROJECT_NAME; override only when the
  # landing repo lives in a GitHub org name different from PROJECT_NAME
  # (e.g. landing repo is in `acme-marketing` while PROJECT_NAME=acme).
  #
  # If your brand has no landing repo (e.g. plugme), comment this whole
  # service out — nginx default-config has a landing-conditional fallback
  # that redirects bare DOMAIN to cloud.${DOMAIN} when landing is absent.
  #
  # env_file ./conf/landing.env is rendered locally from
  # ../landing/src/.env on the dev host (or via render.sh hook); ships as
  # part of the workspace tarball, gitignored — operator manages SMTP
  # creds locally.
  #
  # Server prerequisite: `docker login ghcr.io` once with a PAT carrying
  # read:packages scope, persisted in ~/.docker/config.json.
  #
  # See docs/plans/2026-05-04-landing-cd-pipeline-design.md.
  landing:
    image: ghcr.io/${BRAND_GITHUB_ORG:-${PROJECT_NAME}}/landing:latest
    # No implicit pull. The tag floats, so `pull_policy: always` would let an
    # unrelated `compose up` replace a running service with whatever was last
    # published to a registry abroad — an update nobody here decided to make.
    # The CD pipeline is unaffected: it pulls explicitly (`compose pull landing`)
    # before recreating, and an explicit pull ignores this policy.
    pull_policy: missing
    container_name: landing
    networks:
      - lan-network
    env_file:
      # required:false — conf/ is staged by hooks/pre-install.sh from
      # .secrets/ and is absent from the repository. Without the flag a
      # fresh clone of the template fails even `docker compose config`.
      - path: ./conf/landing.env
        required: false
    healthcheck: *spa-healthcheck

  frontend:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-webapp:${PLATFORM_VERSION:-latest}
    container_name: frontend
    env_file:
      - ./workdir/.env
    networks:
      - lan-network
    healthcheck: *spa-healthcheck

  driver:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-driver:${PLATFORM_VERSION:-latest}
    container_name: driver
    env_file:
      - ./workdir/.env
    networks:
      - lan-network
    restart: unless-stopped
    healthcheck: *spa-healthcheck

  pay:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-pay:${PLATFORM_VERSION:-latest}
    container_name: pay
    env_file:
      - ./workdir/.env
    networks:
      - lan-network
    healthcheck: *spa-healthcheck

  auth:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-auth:${PLATFORM_VERSION:-latest}
    container_name: auth
    env_file:
      - ./workdir/.env
    networks:
      - lan-network
    restart: unless-stopped
    healthcheck: *spa-healthcheck

  # ─── AI support agent ─────────────────────────────────────────────────────
  #
  # Part of the default stack, like every other upstream. It was gated behind
  # `--profile ai` while the image did not exist yet; now that the platform
  # ships it, an opt-in switch only bought a CONFIG\AI ServiceURL pointing at a
  # host nobody started. What stays per-brand is which provider answers, and
  # whether a key is present at all — that lives in LLM_PROVIDER and the vault.
  # A missing key is reported in the driver's chat; it does not stop the
  # container.
  #
  # lan only. The service never faces outward and never touches the database:
  # PGFetch calls it from api.ai_send, and it calls our own REST back with the
  # driver's token, so every platform ACL applies as usual. That is also why
  # ALLOWED_API_URLS and SERVICE_KEY are empty here — both exist for a
  # deployment that publishes the service through nginx.
  #
  # Provider choice is a brand decision, not a platform one. A brand operating
  # in Russia should run yandex or gigachat: OpenAI answers 403
  # unsupported_country_region_territory from a Russian address, and a
  # dependency on a foreign LLM is a blocker in its own right for the national
  # software registry filing.
  ai-service:
    image: ${REGISTRY:-ghcr.io/apostol-csms}/csms-ai-service:${PLATFORM_VERSION:-latest}
    # No implicit pull: the tag is pinned to PLATFORM_VERSION, so re-pulling it
    # on every `up` fetched the same digest and only added a call to a registry
    # abroad. Version changes come from platform.lock.json via update.sh.
    pull_policy: missing
    container_name: ai-service
    networks:
      - lan-network
    restart: unless-stopped
    environment:
      # 0.0.0.0 on the lan network; 127.0.0.1 only when the service runs on
      # the host network behind nginx.
      HOST: ${AI_HOST:-0.0.0.0}
      PORT: ${AI_PORT:-8000}
      API_URL: ${AI_API_URL:-http://backend:4977}
      ALLOWED_API_URLS: ${AI_ALLOWED_API_URLS:-}
      SERVICE_KEY: ${AI_SERVICE_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      LLM_BASE_URL: ${AI_LLM_BASE_URL:-}
      HTTP_PROXY: ${AI_HTTP_PROXY:-}
      # Only ever reaches the LLM client; calls to our own REST are built with
      # trust_env=False and ignore it either way.
      NO_PROXY: ${AI_NO_PROXY:-localhost,127.0.0.1,backend,ocpp,ai-service,postgres,pgbouncer}
      # Declares that this deployment cannot reach a FOREIGN provider without
      # the proxy — /health then treats a missing one as a missing credential
      # instead of reporting a service that looks ready and answers 403 to
      # everything. Irrelevant once the provider is Russian.
      REQUIRE_PROXY: ${AI_REQUIRE_PROXY:-false}
      DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gpt-5.6-terra}
      ACTION_RATE_LIMIT: ${AI_ACTION_RATE_LIMIT:-5}
      ACTION_DEBOUNCE_SECONDS: ${AI_ACTION_DEBOUNCE_SECONDS:-5}
      LOG_LEVEL: ${AI_LOG_LEVEL:-info}
    depends_on:
      - backend

  # ─── Optional ───────────────────────────────────────────────

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe-cli
    networks:
      - lan-network
    command: ["listen", "--api-key", "${STRIPE_API_KEY}", "--device-name", "${PROJECT_NAME:-csms}-${BUILD_ENV:-dev}", "--skip-update", "--forward-to", "http://backend:4977/stripe/webhook"]
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - stripe

networks:
  wan-network:
  lan-network:
  db-network:

volumes:
  letsencrypt:
  postgresql:
  files:
  csms-secrets:   # Persistent role passwords + oauth client secrets.
                  # Populated by entrypoint-secrets.sh on first install
                  # (env-var-aware: prefers DB_PASS_*/OAUTH2_SECRET_*
                  # from env_file, falls back to openssl rand -hex 32).
                  # Mounted into db-init + db-migrate at /var/lib/csms/secrets.
  tmp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=100m
