<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css" />
    <link rel="stylesheet" type="text/css" href="index.css" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
  </head>

  <body>
    <div id="swagger-ui"></div>
    <script src="./oauth-config.js"></script>
    <script src="./swagger-ui-bundle.js" charset="UTF-8"> </script>
    <script src="./swagger-ui-standalone-preset.js" charset="UTF-8"> </script>
    <script>
      window.onload = function() {
        window.ui = SwaggerUIBundle({
          urls: [
            { url: "/docs/api.yaml", name: "API v1" },
            { url: "/docs/api-v2.yaml", name: "API v2" }
          ],
          "urls.primaryName": "API v1",
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "StandaloneLayout"
        });
        // Client and scope of this deployment (rendered at container start).
        var o = window.DOCS_OAUTH || {};
        window.ui.initOAuth({
          clientId: o.clientId,
          scopes: o.scope ? [o.scope] : [],
          usePkceWithAuthorizationCodeGrant: true
        });
      };
    </script>
  </body>
</html>
