user www-data;
worker_processes auto;
# Each proxied WebSocket costs two connection slots (client + upstream), so
# the Debian default of 768 caps a deployment at roughly 7 700 charging
# stations per worker set — a ceiling that is invisible until stations start
# being refused. Slots are cheap: the array is a few hundred bytes each.
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 16384;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# Logging Settings
	##

	# T193 — основной поток уходил ТОЛЬКО в симлинки /dev/stdout и /dev/stderr,
	# то есть в json-лог контейнера, который умирает на каждом --force-recreate.
	# Именно здесь живёт вся активность человека (cloud., api., auth.): у ocpp. и
	# ws. свои файлы есть, у остальных серверов не было. Дублируем, а не переносим:
	# docker logs остаётся дверью, которой пользуются рецепты в карточках и вики.
	access_log /var/log/nginx/access.log;
	access_log /var/log/nginx/main_access.log.gz combined gzip=5 flush=1m;
	error_log /var/log/nginx/error.log;
	error_log /var/log/nginx/main_error.log;
	# gzip=5 — замерено на наших же журналах: сжатие в 16–25 раз, 9 МБ в сутки
	# превращаются в ~0,4 МБ. Читать: zcat / zgrep, НЕ grep — это же относится к
	# отпечатку приёмки T193 по этому файлу.
	#
	# ВАЖНО, проверено пробой на этом же образе: при gzip строки НЕ появляются в
	# файле сразу — он остаётся нулевого размера до сброса буфера. flush=1m значит,
	# что «сейчас» в файле может не быть последней минуты, а жёсткое убийство
	# контейнера эту минуту теряет. Живой взгляд — docker logs, файл — для разбора
	# задним числом. Это второй довод за дублирование, а не за перенос.
	# error_log сжатия НЕ поддерживает (параметр gzip есть только у access_log);
	# поток ошибок мал, оставлен как есть.
	# Станционные ws_access.log / ocpp_access.log НЕ сжимаем намеренно: они малы
	# (178 КБ в сутки), а по ним ходят grep-ом в разборах T189/T190/T196.

	##
	# Rate Limiting
	##

	limit_req_zone $binary_remote_addr zone=auth_token:10m rate=10r/m;
	limit_req_zone $binary_remote_addr zone=auth_identifier:10m rate=10r/m;
	limit_req_zone $binary_remote_addr zone=charge_create:10m rate=60r/m;
	limit_req_zone $binary_remote_addr zone=charge_status:10m rate=600r/m;

	##
	# DNS Resolver — lazy upstream resolution
	##
	# Without this, nginx caches upstream IPs once at start. If a sibling
	# container (landing/frontend/driver/pay/auth/backend/ocpp) restarts and
	# gets a new IP, nginx keeps routing to the dead IP — or worse, if Docker
	# DNS was not ready at nginx start, it falls through to public DNS (e.g.
	# `landing` → `landing.com`). Declaring resolver + variable-based
	# proxy_pass forces per-request re-resolution.
	#
	# valid=5s — worst-case window during which nginx may hold a stale IP
	# after a sibling container is recreated. Combined with (a) healthcheck
	# on the SPA upstreams and (b) update.sh's two-phase rolling_restart
	# (upstreams-healthy → then nginx), this keeps normal deploys race-free.
	# ipv6=off is mandatory: without it nginx may pick AAAA records that
	# resolve to public IPs (e.g. a stranger's driver.com / frontend.com).
	resolver 127.0.0.11 ipv6=off valid=5s;

	map $host $backend_upstream  { default "http://backend:4977"; }
	map $host $auth_upstream     { default "http://auth:3000"; }
	map $host $ocpp_upstream     { default "http://ocpp:9220"; }
	map $host $frontend_upstream { default "http://frontend:3000"; }
	map $host $landing_upstream  { default "http://landing:3000"; }
	map $host $driver_upstream   { default "http://driver:3000"; }
	map $host $pay_upstream      { default "http://pay:3000"; }

	##
	# Gzip Settings
	##

	gzip on;

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
