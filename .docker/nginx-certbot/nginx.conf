user www-data;
worker_processes auto;
# Each proxied WebSocket costs two connection slots (client + upstream), so
# the Debian default of 768 caps a deployment at roughly 7 700 charging
# stations per worker set — a ceiling that is invisible until stations start
# being refused. Slots are cheap: the array is a few hundred bytes each.
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 16384;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# Logging Settings
	##

	# The main stream used to go ONLY to the /dev/stdout and /dev/stderr symlinks,
	# i.e. to the container's json log, which dies on every --force-recreate.
	# That is where all human activity lives (cloud., api., auth.): ocpp. and
	# ws. have their own files, the other servers had none. Duplicated, not moved:
	# docker logs stays the door that runbooks use.
	# The combined format does not write the domain: all servers (cloud., api.,
	# auth., driver., pay., the landing) merged into one stream, and 5xx could not
	# be split by domain. main_host = combined + two fields AT THE END of the
	# line, so that combined parsers (a regex anchored at the start of the line)
	# do not break:
	#   host= $host — the domain from the request (for an IP scanner — the IP itself);
	#   rt=   $request_time — seconds, as in ws_handshake.
	log_format main_host '$remote_addr - $remote_user [$time_local] "$request" '
		'$status $body_bytes_sent "$http_referer" "$http_user_agent" '
		'host=$host rt=$request_time';

	access_log /var/log/nginx/access.log main_host;
	access_log /var/log/nginx/main_access.log.gz main_host gzip=5 flush=1m;
	error_log /var/log/nginx/error.log;
	error_log /var/log/nginx/main_error.log;
	# gzip=5 — measured on our own logs: compression 16–25 times. Read with
	# zcat / zgrep, NOT grep.
	#
	# IMPORTANT, checked on this image: with gzip, lines do NOT appear in the
	# file at once — it stays zero-sized until the buffer is flushed. flush=1m
	# means that "now" the file may lack the last minute, and a hard kill of the
	# container loses that minute. For a live view use docker logs; the file is
	# for after-the-fact analysis. That is a second reason to duplicate, not to move.
	# error_log does not support compression (the gzip parameter exists only for
	# access_log); the error stream is small and left as is.
	# The station ws_access.log / ocpp_access.log are deliberately NOT compressed:
	# they are small and are read with grep.

	# Station handshake journal (ws_access.log / ocpp_access.log).
	# combined sees the User-Agent but not which subprotocol the station offered
	# or whether it sent credentials; that had to be reconstructed with tcpdump.
	# Four fields are added:
	#   proto=    $http_sec_websocket_protocol — what the station offered
	#             (ocpp1.6 / ocpp2.0.1, not a secret);
	#   up_proto= $upstream_http_sec_websocket_protocol — what we answered;
	#   auth=     0/1 — ONLY whether an Authorization header is present. Never
	#             write the value: in Basic it holds the station key. The user name
	#             combined already writes to $remote_user — nginx puts only the part
	#             before the colon there; the password does not reach the log.
	#   rt=       $request_time — for 101 this is the socket's lifetime.
	# IMPORTANT: the line of a WebSocket connection is written when it CLOSES, not at
	# the handshake. A live socket is not visible in the journal until it drops.
	map $http_authorization $ws_has_auth { "" 0; default 1; }

	log_format ws_handshake '$remote_addr - $remote_user [$time_local] "$request" '
		'$status $body_bytes_sent "$http_referer" "$http_user_agent" '
		'proto="$http_sec_websocket_protocol" up_proto="$upstream_http_sec_websocket_protocol" '
		'auth=$ws_has_auth rt=$request_time';

	##
	# Rate Limiting
	##

	limit_req_zone $binary_remote_addr zone=auth_token:10m rate=10r/m;
	limit_req_zone $binary_remote_addr zone=auth_identifier:10m rate=10r/m;
	limit_req_zone $binary_remote_addr zone=charge_create:10m rate=60r/m;
	limit_req_zone $binary_remote_addr zone=charge_status:10m rate=600r/m;

	##
	# DNS Resolver — lazy upstream resolution
	##
	# Without this, nginx caches upstream IPs once at start. If a sibling
	# container (landing/frontend/driver/pay/auth/backend/ocpp) restarts and
	# gets a new IP, nginx keeps routing to the dead IP — or worse, if Docker
	# DNS was not ready at nginx start, it falls through to public DNS (e.g.
	# `landing` → `landing.com`). Declaring resolver + variable-based
	# proxy_pass forces per-request re-resolution.
	#
	# valid=5s — worst-case window during which nginx may hold a stale IP
	# after a sibling container is recreated. Combined with (a) healthcheck
	# on the SPA upstreams and (b) update.sh's two-phase rolling_restart
	# (upstreams-healthy → then nginx), this keeps normal deploys race-free.
	# ipv6=off is mandatory: without it nginx may pick AAAA records that
	# resolve to public IPs (e.g. a stranger's driver.com / frontend.com).
	resolver 127.0.0.11 ipv6=off valid=5s;
	# The stations' upstream group resolves at nginx start; without this the default 30 s resolver_timeout kept
	# the group dead for 20-26 s when `ocpp` was not yet in Docker DNS (measured in the review: 502 until then).
	resolver_timeout 5s;

	map $host $backend_upstream  { default "http://backend:4977"; }
	map $host $auth_upstream     { default "http://auth:3000"; }
	# Stations' upstream: the group `cs_nodes` is rendered by entrypoint.sh into conf.d/cs-nodes.conf from
	# CS_NODES (comma-separated host:port of the `cs` nodes; default `ocpp:9220` = one node, as before). N nodes:
	# CS_NODES=ocpp:9220,ocpp-2:9220 in workdir/.env, then recreate nginx. No ip_hash — any node may hold any station.
	map $host $ocpp_upstream     { default "http://cs_nodes"; }

	# The legacy SOAP entry of the ocpp process (POST /Ocpp…) is not served at the edge: checked on the raw
	# request URI and on the normalised path. WS /ocpp/<id> is not touched.
	map "$request_uri|$uri" $soap_refused {
		default     0;
		"~^/Ocpp"   1;
		"~\|/Ocpp"  1;
	}
	map $host $frontend_upstream { default "http://frontend:3000"; }
	map $host $landing_upstream  { default "http://landing:3000"; }
	map $host $driver_upstream   { default "http://driver:3000"; }
	map $host $pay_upstream      { default "http://pay:3000"; }

	##
	# Gzip Settings
	##

	gzip on;

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
