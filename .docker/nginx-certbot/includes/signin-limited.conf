# Answer for a sign-in request refused by the rate limit (limit_req_status 429).
# The 429 produced by nginx itself has no CORS headers, so a browser or WebView
# reports a network error instead of the status. The headers come from the backend,
# which knows the allowed origins: the request is replayed to it as a bodiless
# OPTIONS and its headers are kept; error_page without "=" keeps the status 429.
# A backend that does not answer within 2 s leaves a plain 429. That fallback is
# an error page inside an error page, so the limited locations that jump here
# carry recursive_error_pages on.
location @signin_limited {
    error_page 502 503 504 = @signin_limited_plain;

    proxy_method OPTIONS;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # The CORS answer needs only Origin: credentials stay out of the replay, and a
    # cookie or redirect in the replay's answer is not passed on with the 429.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Location;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;

    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "close";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location @signin_limited_plain {
    return 429;
}
