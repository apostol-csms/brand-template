# T716 — TLS for the hosts stations connect to (ocpp./ws.; graftio: csms./ws.).
#
# The certbot defaults (/etc/letsencrypt/options-ssl-nginx.conf, Mozilla
# intermediate) plus the two static-RSA suites OCPP 2.0.1 A00.FR.318 requires:
# TLS_RSA_WITH_AES_128_GCM_SHA256 and TLS_RSA_WITH_AES_256_GCM_SHA384
# (OpenSSL: AES128-GCM-SHA256, AES256-GCM-SHA384). They have no forward
# secrecy, which is why certbot leaves them out; the owner took them for the
# stations' hosts only (DECISIONS.md:7833 п. 6). nginx applies ssl_ciphers per
# server by SNI — every other host keeps the certbot list (checked 30.09 on
# nginx 1.28: cloud. refuses AES128-GCM-SHA256, ocpp. accepts it).
#
# Used INSTEAD of options-ssl-nginx.conf in those blocks: nginx refuses a
# second ssl_ciphers in one server.

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384";
