# libpq service file for the backend pool.
# No credentials here: host/user/password still come from PGHOST/PGUSER/PGPASSWORD* in the environment;
# libpq applies these keys only where the conninfo does not set them.
# T1210 — tcp_user_timeout > answer_timeout of the leader lock (15 s at process.leader_interval 5): 10 s dropped the
# leader session from about 6.6 s of network silence (value from csms-backend, measured A/B 10000 vs 20000, card T1210).
# Leadership is lost when the silence lasts longer than p + 13.4 s (p = 0..5 s, from the start of the silence to the lock probe):
# possible from about 13.4 s, certain from about 18.4 s. That is the lock's own 15 s timer, not this key (valid while the
# database RTT is a fraction of a millisecond).
[csms]
tcp_user_timeout=20000
keepalives=1
keepalives_idle=10
keepalives_interval=5
keepalives_count=3
