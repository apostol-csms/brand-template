server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Hidden files and directories are never served from this container.
    location ~ /\. {
        return 404;
    }

    # The client routes of the single-page app get the app shell and nothing
    # else. The list must stay in step with the router table of the frontend;
    # the match is case-insensitive, like the router's.
    location ~* ^/((login|register|recover|authorize|debug|error)/?)?\z {
        try_files /index.html =404;
    }

    # Browsers ask for it on every first visit; there is none to serve.
    location = /favicon.ico {
        return 204;
    }

    # Any other path must be a file that exists.
    location / {
        try_files $uri =404;
    }

    # Cache static assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
